[project]
name = "history-map-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "neo4j>=6.2.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency injection relies on `Depends(...)`/`Query(...)` as
# default arguments; flag them as immutable-call exceptions rather than
# rewriting away from the framework's own required pattern.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit a real Neo4j Aura instance (run with RUN_INTEGRATION_TESTS=1)",
]
